<baza-page-shell

  subtitle="Oferty pracy w transporcie — trasy i powroty do domu"
>

    Monorepo działa. Wspólne typy (np. kadencje powrotu) są dzielone z API:

    @for (cadence of cadences; track cadence) {

    Health check API (przez proxy):
    <code>GET /api/health</code>
  </p>
</baza-page-shell>
