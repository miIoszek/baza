<svg class="baza-banner__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  @if (variant() === 'success') {
    <polyline points="20 6 9 17 4 12" />
  } @else {
    <circle cx="12" cy="12" r="9" />
    <line x1="12" y1="8" x2="12" y2="13" />
    <line x1="12" y1="16.5" x2="12" y2="16.5" />
  }
</svg>
<div class="baza-banner__body">
  @if (title()) {
    <p class="baza-banner__title">{{ title() }}</p>
  }
  <div class="baza-banner__text"><ng-content /></div>
</div>
