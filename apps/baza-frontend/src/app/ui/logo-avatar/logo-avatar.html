@if (logoUrl(); as url) {
  <img
    class="baza-logo-avatar"
    [src]="url"
    alt=""
    [attr.width]="size()"
    [attr.height]="size()"
    loading="lazy"
  />
} @else {
  <span
    class="baza-logo-avatar baza-logo-avatar--placeholder"
    [style.width.px]="size()"
    [style.height.px]="size()"
    [style.font-size.px]="size() * 0.36"
    aria-hidden="true"
  >{{ initial() }}</span>
}
