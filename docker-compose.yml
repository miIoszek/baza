# Local Postgres for development and the API integration tests.
#   docker compose up -d db
#   DATABASE_URL=postgresql://baza:baza@localhost:5432/baza
#   TEST_DATABASE_URL=postgresql://baza:baza@localhost:5432/baza_test
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: baza
      POSTGRES_PASSWORD: baza
      POSTGRES_DB: baza
    ports:
      - '5432:5432'
    volumes:
      - baza-db:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baza']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  baza-db:
