<mat-toolbar class="baza-app-shell__toolbar">
  <a class="baza-app-shell__brand" routerLink="/" aria-label="Baza — strona główna">
    <img class="baza-app-shell__logo" src="/baza-logo.png" alt="" width="36" height="44" />
    <span class="baza-app-shell__brand-text">Baza</span>
  </a>
  <span class="baza-app-shell__spacer"></span>
  <a
    mat-button
    routerLink="/"
    routerLinkActive="baza-app-shell__active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    Oferty pracy
  </a>
  @if (accountLabel()) {
    <a
      mat-button
      routerLink="/company/offers"
      routerLinkActive="baza-app-shell__active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Moje oferty
    </a>
    <a
      mat-button
      routerLink="/company/inbox"
      routerLinkActive="baza-app-shell__active"
    >
      Skrzynka
    </a>
    <a
      mat-button
      routerLink="/company/offers/new"
      routerLinkActive="baza-app-shell__active"
    >
      Dodaj ofertę
    </a>
    <a
      class="baza-app-shell__account-wrap"
      routerLink="/company/profile"
      routerLinkActive="baza-app-shell__account-wrap--active"
      [attr.aria-label]="'Profil firmy: ' + accountLabel()"
    >
      @if (accountAvatarUrl()) {
        <img
          class="baza-app-shell__avatar"
          [src]="accountAvatarUrl()!"
          alt=""
          width="32"
          height="32"
        />
      } @else {
        <span class="baza-app-shell__avatar baza-app-shell__avatar--placeholder" aria-hidden="true">
          {{ accountLabel()!.charAt(0).toUpperCase() }}
        </span>
      }
      <span class="baza-app-shell__account">{{ accountLabel() }}</span>
    </a>
    <button mat-button type="button" (click)="logout.emit()">Wyloguj</button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="baza-app-shell__active">
      Login
    </a>
  }
</mat-toolbar>
<main class="baza-app-shell__main">
  <ng-content />
</main>
